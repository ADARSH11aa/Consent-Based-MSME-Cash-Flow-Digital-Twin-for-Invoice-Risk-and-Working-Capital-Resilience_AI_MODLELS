[project]
name = "msme-cashflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pushpak Kumar Bagadia", email = "officialbagadia@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "uvicorn>=0.52.3",
    "xgboost>=3.4.0",
]

[project.scripts]
msme-cashflow = "msme_cashflow:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
